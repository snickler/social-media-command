name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore SocialMediaCommander.sln

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity diagnostic SocialMediaCommander.sln

      - name: Build for analysis
        run: dotnet build SocialMediaCommander.sln --configuration Release --no-restore

