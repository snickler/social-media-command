name: Build and Release

# This workflow:
#   - Builds and tests on all commits/PRs
#   - For Dependabot PRs: Only runs linux-x64 builds/tests (skips publishing) to save CI time (~90% faster, ~3 min instead of ~30 min)
#   - For regular PRs/commits: Runs full platform matrix with builds and tests
#   - When a tag is pushed (e.g., v1.2.3 from semantic-release), it:
#     * Builds artifacts for all platforms
#     * Creates a GitHub release
#     * Attaches built artifacts to the release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.sln'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '.github/workflows/ci-cd.yml'
  release:
    types: [published]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22.x'
  NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  # Disable telemetry to prevent network calls during build/test
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  VSTEST_TELEMETRY_OPTEDIN: '0'
  # Disable DNS lookups and network access
  DOTNET_SYSTEM_NET_DISABLEIPV6: '1'
  # Disable Avalonia build analyzer to prevent network calls
  AvaloniaEnableBuildAnalyzer: 'false'
  DEPENDABOT_RUNNER: 'linux-x64'

permissions:
  contents: read
  pull-requests: write
jobs:
  build-and-test:
    name: Build & Test ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-latest
            rid: win-x64
          - os: windows
            arch: arm64
            runner: windows-latest
            rid: win-arm64
          - os: linux
            arch: x64
            runner: ubuntu-latest
            rid: linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            rid: linux-arm64
          - os: macos
            arch: x64
            runner: macos-13
            rid: osx-x64
          - os: macos
            arch: arm64
            runner: macos-latest
            rid: osx-arm64

    steps:
      - name: Check if should skip this platform for Dependabot
        id: should_skip
        shell: bash
        run: |
          # For Dependabot PRs, only run linux-x64 to save CI time
          # We check both github.actor and github.event.pull_request.user.login for robustness:
          # - github.actor is set to dependabot[bot] for PRs created by Dependabot
          # - github.event.pull_request.user.login is set to dependabot[bot] for PR events
          IS_DEPENDABOT="false"
          IS_DEPENDABOT="false"
            IS_DEPENDABOT="true"
          if [[ "$IS_DEPENDABOT" == "true" ]] && [[ "${{ matrix.os }}-${{ matrix.arch }}" != "${DEPENDABOT_RUNNER}" ]]; then
            SHOULD_SKIP="true"
            echo "Skipping ${{ matrix.os }}-${{ matrix.arch }} for Dependabot PR"
          fi
          
          echo "skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT
          echo "is_dependabot=$IS_DEPENDABOT" >> $GITHUB_OUTPUT
      - name: Checkout
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/checkout@v5

      # Cache NuGet packages to speed up restore
      - name: Cache NuGet packages
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Ensure consistent NuGet behavior across platforms
          source-url: https://api.nuget.org/v3/index.json

      # Cache Node modules for frontend
      - name: Cache Node modules
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version
        if: steps.should_skip.outputs.skip != 'true'
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="1.0.0-preview.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Restore dependencies
        if: steps.should_skip.outputs.skip != 'true'
        shell: bash
        run: |
          dotnet clean SocialMediaCommander.sln
          # macOS: Don't pass Platform property due to missing ARM64 SwiftShader libraries
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            dotnet restore SocialMediaCommander.sln --force
          else
            dotnet restore SocialMediaCommander.sln --force -p:Platform=${{ matrix.arch }}
          fi

      - name: Verify macOS dependencies (macOS only)
        if: steps.should_skip.outputs.skip != 'true' && matrix.os == 'macos'
        run: |
          echo "Checking for Avalonia native libraries..."
          find ~/.nuget/packages -name "*.dylib" | head -10 || true
          echo "Verifying Avalonia packages..."
          dotnet list SocialMediaCommander.Desktop package | grep -i avalonia || true

      - name: Set up QEMU for ARM64 emulation
        if: steps.should_skip.outputs.skip != 'true' && matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install ARM64 cross-compilation toolchain
        if: steps.should_skip.outputs.skip != 'true' && matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "OBJCOPY=aarch64-linux-gnu-objcopy" >> $GITHUB_ENV
          echo "STRIP=aarch64-linux-gnu-strip" >> $GITHUB_ENV
          
          # Create wrapper scripts so .NET AOT can find ARM64 binutils
          # The AOT compiler calls 'objcopy' and 'strip' directly, ignoring env vars
          sudo mkdir -p /usr/local/bin/dotnet-aot-wrapper
          echo '#!/bin/bash' | sudo tee /usr/local/bin/dotnet-aot-wrapper/objcopy > /dev/null
          echo 'exec aarch64-linux-gnu-objcopy "$@"' | sudo tee -a /usr/local/bin/dotnet-aot-wrapper/objcopy > /dev/null
          echo '#!/bin/bash' | sudo tee /usr/local/bin/dotnet-aot-wrapper/strip > /dev/null
          echo 'exec aarch64-linux-gnu-strip "$@"' | sudo tee -a /usr/local/bin/dotnet-aot-wrapper/strip > /dev/null
          sudo chmod +x /usr/local/bin/dotnet-aot-wrapper/objcopy
          sudo chmod +x /usr/local/bin/dotnet-aot-wrapper/strip
          echo "/usr/local/bin/dotnet-aot-wrapper" >> $GITHUB_PATH

      - name: Build
        if: steps.should_skip.outputs.skip != 'true'
        shell: bash
        run: |
          # macOS: Don't pass Platform property due to missing ARM64 SwiftShader libraries in Avalonia.Skia
          # The runtime identifier in the publish step will handle architecture selection
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            dotnet build SocialMediaCommander.sln --no-restore --configuration Release
          else
            dotnet build SocialMediaCommander.sln --no-restore --configuration Release -p:Platform=${{ matrix.arch }}
          fi
        timeout-minutes: 10

      - name: Test
        if: steps.should_skip.outputs.skip != 'true' && matrix.arch == 'x64'
        continue-on-error: true
        shell: bash
        run: |
          # macOS: Don't pass Platform property due to missing ARM64 SwiftShader libraries
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            dotnet test SocialMediaCommander.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings SocialMediaCommander.Tests/test.runsettings
          else
            dotnet test SocialMediaCommander.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings SocialMediaCommander.Tests/test.runsettings -p:Platform=${{ matrix.arch}}
          fi
        timeout-minutes: 10

      - name: UI Tests
        if: steps.should_skip.outputs.skip != 'true' && matrix.arch == 'x64'
        continue-on-error: true
        shell: bash
        run: |
          # macOS: Don't pass Platform property due to missing ARM64 SwiftShader libraries
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            dotnet test SocialMediaCommander.Tests/SocialMediaCommander.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~SocialMediaCommander.Tests.UI" --verbosity normal --logger "trx;LogFileName=ui-tests.trx" --settings SocialMediaCommander.Tests/test.runsettings
          else
            dotnet test SocialMediaCommander.Tests/SocialMediaCommander.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~SocialMediaCommander.Tests.UI" --verbosity normal --logger "trx;LogFileName=ui-tests.trx" --settings SocialMediaCommander.Tests/test.runsettings -p:Platform=${{ matrix.arch}}
          fi
        timeout-minutes: 5

      - name: Upload UI Screenshots
        if: steps.should_skip.outputs.skip != 'true' && matrix.arch == 'x64' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            **/Screenshots/TestRun/*.png
            **/test-recordings/*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Code Coverage Report
        if: steps.should_skip.outputs.skip != 'true' && matrix.os == 'linux' && matrix.arch == 'x64'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        if: steps.should_skip.outputs.skip != 'true' && matrix.os == 'linux' && matrix.arch == 'x64' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Publish Desktop App
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true'
        shell: bash
        run: |
          # Native AOT is now enabled for all platforms including linux-arm64 with cross-compilation toolchain
          dotnet publish SocialMediaCommander.Desktop/SocialMediaCommander.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output ./publish/${{ matrix.os }}-${{ matrix.arch }} -p:Version=${{ steps.version.outputs.version }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        timeout-minutes: 15

      - name: Create Windows Installer
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true' && matrix.os == 'windows'
        shell: pwsh
        run: |
          # Create a simple batch file for Windows
          $batchContent = @"
          @echo off
          echo Starting Social Media Commander...
          "%~dp0SocialMediaCommander.Desktop.exe"
          "@
          $batchContent | Out-File -FilePath "./publish/${{ matrix.os }}-${{ matrix.arch }}/start.bat" -Encoding ASCII

      - name: Create macOS App Bundle
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true' && matrix.os == 'macos'
        run: |
          APP_NAME="Social Media Commander"
          APP_DIR="./publish/${{ matrix.os }}-${{ matrix.arch }}/$APP_NAME.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          # Move executable
          mv "./publish/${{ matrix.os }}-${{ matrix.arch }}/SocialMediaCommander.Desktop" "$APP_DIR/Contents/MacOS/"
          
          # Create Info.plist
          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SocialMediaCommander.Desktop</string>
              <key>CFBundleIdentifier</key>
              <string>com.socialmediacommander.desktop</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Create Linux AppImage
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true' && matrix.os == 'linux'
        run: |
          # Determine architecture suffix for linuxdeploy
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            arch_suffix="aarch64"
          else
            arch_suffix="x86_64"
          fi

          # Install AppImage tools
          # For ARM64: QEMU user-mode emulation allows running ARM64 binaries on x64 runners
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${arch_suffix}.AppImage
          chmod +x linuxdeploy-${arch_suffix}.AppImage

          # For ARM64: Extract x64 AppImage and use it to process ARM64 binaries
          # Direct execution of ARM64 AppImages fails in QEMU emulation
          # Solution: Use the x64 linuxdeploy (which runs natively) for all the work
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo "Using x64 linuxdeploy to package ARM64 binaries..."
            
            # Download x64 version which can run natively
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage
            
            # linuxdeploy doesn't care about the architecture of the binaries it packages
            # It just copies files and creates the AppImage structure
            # So we can use x64 linuxdeploy to package ARM64 binaries
            LINUXDEPLOY_CMD="./linuxdeploy-x86_64.AppImage"
          else
            LINUXDEPLOY_CMD="./linuxdeploy-${arch_suffix}.AppImage"
          fi

          # Install required X11 libraries for Avalonia (architecture-specific)
          echo "Installing X11 libraries required by Avalonia..."
          
          # Determine the library architecture path
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            # For ARM64: Download and extract ARM64 .deb packages manually
            # This avoids cross-architecture apt repository issues
            echo "Downloading ARM64 X11 libraries..."
            
            mkdir -p /tmp/arm64-libs
            cd /tmp/arm64-libs
            
            # Download ARM64 library packages from Ubuntu ports
            # Using focal (Ubuntu 20.04) for better compatibility
            BASE_URL="http://ports.ubuntu.com/ubuntu-ports/pool/main"
            
            wget -q "${BASE_URL}/libx/libx11/libx11-6_1.8.7-1build1_arm64.deb" || true
            wget -q "${BASE_URL}/libx/libxext/libxext6_1.3.4-1build2_arm64.deb" || true
            wget -q "${BASE_URL}/libx/libxi/libxi6_1.8.1-1build1_arm64.deb" || true
            wget -q "${BASE_URL}/libx/libxrandr/libxrandr2_1.5.4-1_arm64.deb" || true
            wget -q "${BASE_URL}/libx/libxcursor/libxcursor1_1.2.2-1_arm64.deb" || true
            wget -q "${BASE_URL}/libx/libxinerama/libxinerama1_1.1.5-1_arm64.deb" || true
            wget -q "${BASE_URL}/libi/libice/libice6_1.1.1-1_arm64.deb" || true
            wget -q "${BASE_URL}/libs/libsm/libsm6_1.2.4-1_arm64.deb" || true
            wget -q "${BASE_URL}/f/fontconfig/libfontconfig1_2.15.0-1.1ubuntu2_arm64.deb" || true
            wget -q "${BASE_URL}/f/freetype/libfreetype6_2.13.2+dfsg-1build3_arm64.deb" || true
            
            # Extract all .deb packages
            for deb in *.deb; do
              if [ -f "$deb" ]; then
                dpkg-deb -x "$deb" extracted/
              fi
            done
            
            # Set library path to extracted location
            LIB_ARCH_PATH="/tmp/arm64-libs/extracted/usr/lib/aarch64-linux-gnu"
            
            cd - > /dev/null
          else
            # Install native x64 libraries
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              libice6 \
              libsm6 \
              libx11-6 \
              libxext6 \
              libxrandr2 \
              libxcursor1 \
              libxi6 \
              libxinerama1 \
              libfontconfig1 \
              libfreetype6 \
              liblttng-ust1t64 \
              2>&1 | grep -v "^Get:" || true
            
            # Ubuntu 24.04 provides liblttng-ust.so.1, but .NET runtime needs liblttng-ust.so.0
            # Create a compatibility symlink for backward compatibility
            if [ -f "/usr/lib/x86_64-linux-gnu/liblttng-ust.so.1" ] && [ ! -f "/usr/lib/x86_64-linux-gnu/liblttng-ust.so.0" ]; then
              sudo ln -s /usr/lib/x86_64-linux-gnu/liblttng-ust.so.1 /usr/lib/x86_64-linux-gnu/liblttng-ust.so.0
              echo "Created compatibility symlink: liblttng-ust.so.0 -> liblttng-ust.so.1"
            fi
            
            LIB_ARCH_PATH="/usr/lib/x86_64-linux-gnu"
          fi

          # Create AppDir structure
          mkdir -p SocialMediaCommander.AppDir/usr/bin
          mkdir -p SocialMediaCommander.AppDir/usr/lib
          mkdir -p SocialMediaCommander.AppDir/usr/share/applications
          mkdir -p SocialMediaCommander.AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy executable
          cp ./publish/${{ matrix.os }}-${{ matrix.arch }}/SocialMediaCommander.Desktop SocialMediaCommander.AppDir/usr/bin/
          
          # Copy all published dependencies
          cp -r ./publish/${{ matrix.os }}-${{ matrix.arch }}/* SocialMediaCommander.AppDir/usr/bin/ 2>/dev/null || true
          
          # Bundle native libraries from the publish output (SkiaSharp, Avalonia, etc.)
          echo "Bundling native libraries from publish output..."
          find ./publish/${{ matrix.os }}-${{ matrix.arch }} -name "*.so*" -type f | while read lib; do
            cp "$lib" SocialMediaCommander.AppDir/usr/lib/
            echo "  Bundled: $(basename $lib)"
          done
          
          # Bundle required X11 libraries into the AppImage
          # These are needed by Avalonia for X11 support
          echo "Bundling X11 libraries from $LIB_ARCH_PATH..."
          for lib in libICE.so.6 libSM.so.6 libX11.so.6 libXext.so.6 libXrandr.so.2 \
                     libXcursor.so.1 libXi.so.6 libXinerama.so.1 libfontconfig.so.1 libfreetype.so.6; do
            if [ -f "$LIB_ARCH_PATH/$lib" ]; then
              cp "$LIB_ARCH_PATH/$lib" SocialMediaCommander.AppDir/usr/lib/
              echo "  Bundled: $lib (from $LIB_ARCH_PATH)"
            elif [ -f "/usr/lib/$lib" ]; then
              cp "/usr/lib/$lib" SocialMediaCommander.AppDir/usr/lib/
              echo "  Bundled: $lib (from /usr/lib)"
            fi
          done
          
          # Create desktop file
          cat > SocialMediaCommander.AppDir/usr/share/applications/socialmediacommander.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=Social Media Commander
          Exec=SocialMediaCommander.Desktop
          Icon=socialmediacommander
          Categories=Network;Office;
          EOF
          
          # Create a simple icon (placeholder)
          echo "Creating placeholder icon..."
          touch SocialMediaCommander.AppDir/usr/share/icons/hicolor/256x256/apps/socialmediacommander.png
          
          # Create AppImage using the appropriate command
          # Set ARCH environment variable for appimagetool
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export ARCH=aarch64
          else
            export ARCH=x86_64
          fi
          
          $LINUXDEPLOY_CMD --appdir SocialMediaCommander.AppDir --output appimage
          mv Social_Media_Commander-*.AppImage "./publish/${{ matrix.os }}-${{ matrix.arch }}/SocialMediaCommander-${{ steps.version.outputs.version }}-${{ matrix.arch }}.AppImage" || true
          
      - name: Archive artifacts
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true'
        shell: bash
        run: |
          cd ./publish/${{ matrix.os }}-${{ matrix.arch }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../SocialMediaCommander-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.zip" .
          else
            tar -czf "../SocialMediaCommander-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" .
          fi

      - name: Upload artifacts
        if: steps.should_skip.outputs.skip != 'true' && steps.should_skip.outputs.is_dependabot != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SocialMediaCommander-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ./publish/SocialMediaCommander-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.*
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -la ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
